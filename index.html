<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Radio Hit — En Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0b0d;
    --bg-1:#151317;
    --red:#e5233a;
    --lime:#c8ff3d;
    --ink:#f5f4f0;
    --ink-dim:#a9a6ab;
    --line:#2a2830;
    --player-h:72px;
    --tabs-h:64px;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}

  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Archivo',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  button{font-family:inherit;}

  /* ============================================================
     VISTA — INICIO (portada a pantalla completa, video + overlay)
  ============================================================ */
  #home-view{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      linear-gradient(180deg, rgba(11,11,13,.15) 0%, rgba(11,11,13,.55) 58%, var(--bg-0) 92%),
      radial-gradient(120% 70% at 78% 18%, rgba(229,35,58,.30), transparent 60%);
    padding-bottom: calc(var(--player-h) + var(--tabs-h) + 10px);
    overflow:hidden;
  }

  .hero-video{
    position:absolute;
    inset:0;
    z-index:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    opacity:.85;
  }
  .grain{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 46px);
  }

  header{
    position:relative;z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:44px;height:44px;border-radius:50%;background:var(--bg-1);
    border:2px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:13px;flex-shrink:0;
    overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-name{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.02em;}

  .hero{
    position:relative;z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:16px;
    padding:24px clamp(20px,6vw,64px) 30px;
  }

  .live-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 18px 8px 14px;border-radius:999px;
    background:var(--red);
    font-size:13px;letter-spacing:.03em;color:var(--bg-0);font-weight:800;
    width:fit-content;
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;background:var(--bg-0);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(11,11,13,.55);}
    70%{box-shadow:0 0 0 9px rgba(11,11,13,0);}
    100%{box-shadow:0 0 0 0 rgba(11,11,13,0);}
  }

  .hero h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(32px,9vw,48px);
    letter-spacing:.005em;
    line-height:1.02;
    max-width:12ch;
  }
  .hero p.tagline{color:var(--ink-dim);font-size:15px;font-weight:600;letter-spacing:.02em;}

  .social-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
  .social-row a{
    width:42px;height:42px;border-radius:50%;
    background:rgba(245,244,240,.06);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);text-decoration:none;
    transition:border-color .2s,color .2s,transform .15s,background .2s;
  }
  .social-row a:hover{border-color:var(--red);color:var(--red);transform:translateY(-2px);}
  .social-row svg{width:18px;height:18px;}

  /* ============================================================
     BARRA DE REPRODUCTOR — pie de página, fija, sobre la barra de tabs
  ============================================================ */
  #player-footer{
    position:fixed;
    left:0;right:0;
    bottom:var(--tabs-h);
    z-index:21;
    background:#141216;
    border-top:1px solid var(--line);
    box-shadow:0 -6px 20px -8px rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    padding:0 clamp(10px,3vw,24px);
  }

  /* Contenedor que centra el widget de Caster.fm dentro de la barra */
  #player-footer .widget-wrap{
    width:100%;
    max-width:960px;
    margin:0 auto;
  }
  /* El script de Caster.fm inyecta su propio markup dentro de este div.
     El widget ya es responsive por diseño, así que solo lo estiramos
     al 100% del ancho y dejamos que él resuelva su propio alto. */
  #player-footer .cstrEmbed,
  #player-footer .cstrEmbed iframe{
    width:100% !important;
    max-width:100% !important;
    display:block;
    border:0;
  }
  /* Oculta los enlaces de atribución de texto que trae el snippet crudo
     (el widget real se renderiza vía iframe/script, estos <a> son fallback) */
  #player-footer .cstrEmbed > a{
    display:none;
  }

  /* ---- Barra de tabs inferior ---- */
  #tab-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    height:var(--tabs-h);
    background:#f4f3f0;
    display:flex;
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .tab-btn{
    flex:1;
    border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;
    color:#8b8890;
    font-size:11px;font-weight:700;letter-spacing:.03em;
  }
  .tab-btn svg{width:22px;height:22px;}
  .tab-btn.active{color:var(--bg-0);}

  @media (max-width:420px){
    header{padding:18px 16px;}
    :root{ --player-h:76px; }
  }
</style>
</head>
<body>

<!-- ============ VISTA: INICIO ============ -->
<div id="home-view">

  <video class="hero-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="https://github.com/MorelDa/party-music/raw/refs/heads/main/Ney_Pereira_RJ_pindown.io_1788530495.mp4" type="video/mp4">
  </video>
  <div class="grain"></div>

  <header>
    <div class="brand">
      <div class="brand-mark"><img src="data:image/jpeg;base64,PLACEHOLDER" alt="Radio Hit"></div>
      <div class="brand-name">RADIO HIT</div>
    </div>
  </header>

  <div class="hero">
    <span class="live-pill"><span class="live-dot"></span>EN DIRECTO</span>
    <h1>Radio Hit</h1>
    <p class="tagline">ACTIVANDO TU DÍA</p>

    <div class="social-row">
      <a href="#" target="_blank" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12"/></svg></a>
      <a href="#" target="_blank" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.38 1.26 4.8L2 22l5.44-1.36a9.9 9.9 0 0 0 4.6 1.14h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.87 9.87 0 0 0 12.04 2zm5.78 14.2c-.24.68-1.4 1.3-1.93 1.36-.5.06-1.02.28-3.42-.72-2.9-1.2-4.77-4.15-4.92-4.34-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.14.12.32.02.51-.1.2-.15.32-.3.5-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.62 2.01 1.12 1 2.06 1.31 2.35 1.46.29.15.46.13.63-.08.17-.2.72-.84.91-1.13.19-.29.38-.24.63-.15.25.1 1.61.76 1.89.9.28.14.46.21.53.33.07.12.07.68-.17 1.35z"/></svg></a>
      <a href="#" target="_blank" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a href="#" target="_blank" aria-label="Sitio web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
      <a href="#" target="_blank" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.5 6.19a2.78 2.78 0 0 0-1.96-1.97C18.88 3.75 12 3.75 12 3.75s-6.88 0-8.54.47A2.78 2.78 0 0 0 1.5 6.19 29 29 0 0 0 1 11.5a29 29 0 0 0 .5 5.31 2.78 2.78 0 0 0 1.96 1.97c1.66.47 8.54.47 8.54.47s6.88 0 8.54-.47a2.78 2.78 0 0 0 1.96-1.97 29 29 0 0 0 .5-5.31 29 29 0 0 0-.5-5.31zM9.75 14.85V8.15L15.5 11.5z"/></svg></a>
    </div>
  </div>
</div>

<!-- ============ BARRA DE REPRODUCTOR (pie de página, sobre las tabs) ============ -->
<div id="player-footer">
  <div class="widget-wrap">
    <div data-type="newStreamPlayer" data-publicToken="64fdbc99-cc1a-42ab-bf75-f21466970115" data-theme="light" data-color="e81e4d" data-channelId="a2aac58b-77e0-432b-84f5-56ea182a5387" data-rendered="false" class="cstrEmbed">
      <a href="https://www.caster.fm">Shoutcast Hosting</a>
      <a href="https://www.caster.fm">Stream Hosting</a>
      <a href="https://www.caster.fm">Radio Server Hosting</a>
    </div>
  </div>
</div>

<!-- Barra de tabs inferior -->
<nav id="tab-bar">
  <button class="tab-btn active" id="tab-inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    INICIO
  </button>
  <button class="tab-btn" id="tab-programas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    PROGRAMAS
  </button>
</nav>

<script>
  const tabInicio    = document.getElementById('tab-inicio');
  const tabProgramas = document.getElementById('tab-programas');

  tabInicio.addEventListener('click', () => {
    tabInicio.classList.add('active');
    tabProgramas.classList.remove('active');
    window.scrollTo({top:0, behavior:'smooth'});
  });
  tabProgramas.addEventListener('click', () => {
    tabProgramas.classList.add('active');
    tabInicio.classList.remove('active');
  });
</script>

<!-- Script del reproductor Caster.fm: URL corregida (antes tenía doble
     slash "//widgets/embed.js", lo que rompía la carga del script y por
     eso el reproductor no aparecía) -->
<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
</body>
</html>
